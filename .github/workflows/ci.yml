name: Code quality

on:
  push:

jobs:
  quality:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.10
      - name: Run Biome
        run: biome ci .
